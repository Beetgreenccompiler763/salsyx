[package]
name = "aahl"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jamal Tiliouan", "Salma Zelmati"]
repository = "https://github.com/lmdelm-dev/salsyx"
homepage = "https://salsyx.pages.dev"
documentation = "https://docs.rs/aahl"
description = "AAHL (ArchiveHub Archive Layer): a lossless, chunked, content-addressed archive format for long-term software preservation."
readme = "README.md"
keywords = ["archive", "preservation", "chunking", "content-addressed", "deduplication"]
categories = ["compression", "encoding", "filesystem"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
async-trait = "0.1"
tracing = "0.1"
zstd = { version = "0.13", optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[features]
default = ["zstd"]
zstd = ["dep:zstd"]
sign = ["dep:ed25519-dalek", "dep:rand_core"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
