[app]
env = "development"
allow_public_archive_requests = true
refresh_ttl_secs = 3600
# Archive format produced by the crawler: "git_bundle" or "aahl".
crawler_format = "git_bundle"

[server]
host = "127.0.0.1"
port = 8080
allowed_origin = "http://localhost:3000"
openapi_path = "openapi.json"
# Bearer token for /api/v1/admin/*. Empty = admin routes disabled.
admin_token = ""

[database]
# Local dev: `docker compose up -d db` provides a Postgres on 5432.
url = "postgres://salsyx:salsyx@localhost:5432/salsyx"
max_connections = 10
acquire_timeout_secs = 5
auto_migrate = true

[github]
base_url = "https://api.github.com"
token = ""
user_agent = "salsyx/0.1 (nothing-open-source-should-disappear)"
timeout_secs = 15
webhook_secret = ""

[storage]
# "local" (dev) | "r2" (Cloudflare R2) | "s3" (Storj/MinIO/Garage/B2...)
# To enable failover, set `providers` to an ordered list and leave
# `provider` ignored, e.g. providers = ["s3", "r2"] (writes go to the first
# healthy one; reads fall through to whichever holds the object).
provider = "local"
providers = []
local_root = "./data/archives"
r2_endpoint = ""
r2_bucket = ""
r2_account_id = ""
r2_access_key_id = ""
r2_secret_access_key = ""
r2_public_base_url = ""
s3_endpoint = ""
s3_bucket = ""
s3_region = "auto"
s3_access_key_id = ""
s3_secret_access_key = ""
s3_public_base_url = ""

[queue]
capacity = 1024
worker_concurrency = 4

[providers]
# Provider slugs to skip in the resolution chain (e.g. ["archive_org"]).
disabled = []
