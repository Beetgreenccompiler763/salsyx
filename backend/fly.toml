# Fly.io configuration for the Salsyx API.
#
#   flyctl launch --config backend/fly.toml
#   flyctl secrets set AH_DATABASE__URL=... AH_GITHUB__TOKEN=...
#   flyctl secrets set AH_STORAGE__PROVIDER=r2 AH_STORAGE__R2_...=...
#
# The Postgres database itself should be provisioned via `flyctl postgres
# create` (or use Neon free tier — set AH_DATABASE__URL to the Neon URL).

app = "salsyx-api"

[build]
  dockerfile = "Dockerfile"

[env]
  AH_APP__ENV = "production"
  AH_SERVER__HOST = "0.0.0.0"
  AH_SERVER__PORT = "8080"
  # Allow the frontend's origin. Swap for your Pages project domain.
  AH_SERVER__ALLOWED_ORIGIN = "https://salsyx.pages.dev"
  # R2 account id + endpoint are set as Fly secrets (AH_STORAGE__R2_ACCOUNT_ID,
  # AH_STORAGE__R2_ENDPOINT) to keep Cloudflare account details out of VCS.
  AH_STORAGE__PROVIDER = "r2"
  AH_STORAGE__R2_BUCKET = "salsyx"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "salsyx_storage"
  destination = "/data"

[metrics]
  port = 9091
  path = "/metrics"
