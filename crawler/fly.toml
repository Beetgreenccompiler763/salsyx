# Fly.io configuration for the Salsyx crawler workers.
#
# The crawler is a separate, horizontally-scalable process: it only needs
# the database + storage, and it has no public HTTP port.
#
#   flyctl launch --config crawler/fly.toml
#   flyctl scale count 3   # scale workers independently

app = "salsyx-crawler"

[build]
  dockerfile = "Dockerfile"

[env]
  AH_APP__ENV = "production"
  AH_CRAWLER_CONCURRENCY = "4"
  # R2 account id + endpoint are set as Fly secrets (AH_STORAGE__R2_ACCOUNT_ID,
  # AH_STORAGE__R2_ENDPOINT) to keep Cloudflare account details out of VCS.
  AH_STORAGE__PROVIDER = "r2"
  AH_STORAGE__R2_BUCKET = "salsyx"

[[mounts]]
  source = "salsyx_storage"
  destination = "/data"

[processes]
  worker = "salsyx-crawler"
